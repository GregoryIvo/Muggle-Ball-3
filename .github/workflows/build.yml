name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libgl-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Compile-only check of the GL back end (engine/src/render/gl/): a Linux runner has no GPU device,
      # so this does not configure MB3_BUILD_TESTS' render test to run, only to link.
      - name: Configure and build the GL back end
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-gl -G Ninja -DCMAKE_BUILD_TYPE=Release -DMB3_RENDERER=GL
          cmake --build build-gl --target mb_engine mb_render_test

      - name: Converter tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  package-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ninja

      # A universal app with SDL3 built from source, signed ad-hoc: the script checks that both
      # architectures are there, that it links only system libraries, and that the signature verifies.
      - name: Package
        run: scripts/package_macos.sh --universal
